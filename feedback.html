<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportFit Feedback</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #031225;
            color: #f6f9ff;
            font-family: Arial, sans-serif;
        }
        .card {
            width: min(560px, 100%);
            padding: 30px;
            background: #071a30;
            border: 1px solid #1c3d63;
            border-radius: 14px;
        }
        h1 { margin: 0 0 8px; color: #fff; }
        .intro { margin: 0 0 24px; color: #8fa7c4; line-height: 1.5; }
        label { display: block; margin: 15px 0 7px; color: #dbe9fa; font-size: 14px; }
        input, select, textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #2a4e78;
            border-radius: 7px;
            background: #04172b;
            color: #f6f9ff;
            font: inherit;
        }
        textarea { min-height: 130px; resize: vertical; }
        input:focus, select:focus, textarea:focus { outline: 2px solid #4b9aff; outline-offset: 1px; }
        .actions { display: flex; gap: 12px; align-items: center; margin-top: 20px; }
        button, .back {
            display: inline-block;
            padding: 11px 16px;
            border: 0;
            border-radius: 7px;
            background: #126cff;
            color: white;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }
        .back { background: transparent; border: 1px solid #50739e; }
        #message { color: #8be51c; font-size: 13px; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Send feedback</h1>
        <p class="intro">Tell us what is working well or how we can make SportFit better.</p>
        <form id="feedbackForm">
            <label for="type">Feedback type</label>
            <select id="type" required>
                <option value="Suggestion">Suggestion</option>
                <option value="Bug report">Bug report</option>
                <option value="Accessibility">Accessibility</option>
                <option value="Compliment">Compliment</option>
            </select>
            <label for="messageInput">Your feedback</label>
            <textarea id="messageInput" maxlength="1000" placeholder="Write your feedback here..." required></textarea>
            <div class="actions">
                <button type="submit">Send feedback</button>
                <a class="back" href="dashboard.html">Back to dashboard</a>
                <span id="message" role="status"></span>
            </div>
        </form>
    </main>
    <script>
        document.getElementById("feedbackForm").addEventListener("submit", (event) => {
            event.preventDefault();
            const type = document.getElementById("type").value;
            const feedback = document.getElementById("messageInput").value.trim();
            const saved = JSON.parse(localStorage.getItem("sportfitFeedback") || "[]");
            saved.push({ type, feedback, createdAt: new Date().toISOString() });
            localStorage.setItem("sportfitFeedback", JSON.stringify(saved));
            document.getElementById("message").textContent = "Thanks! Your feedback was saved.";
            event.target.reset();
        });
    </script>
</body>
</html>
